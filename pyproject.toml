[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "open-mythos"
version = "0.5.0"
description = "OpenMythos — open-source theoretical reconstruction of the Claude Mythos Recurrent-Depth Transformer architecture"
license = "MIT"
authors = ["Kye Gomez <kye@swarms.world>"]
homepage = "https://github.com/The-Swarm-Corporation/OpenMythos"
documentation = "https://github.com/The-Swarm-Corporation/OpenMythos/blob/main/docs/open_mythos.md"
readme = "README.md"
repository = "https://github.com/The-Swarm-Corporation/OpenMythos"
keywords = [
    "artificial intelligence",
    "deep learning",
    "transformers",
    "recurrent transformers",
    "looped transformers",
    "mixture of experts",
    "multi-latent attention",
    "grouped query attention",
    "adaptive computation time",
    "recurrent depth transformer",
    "LTI stability",
    "inference-time scaling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
torch = ">=2.1,<3.0"
transformers = ">=4.40.0"
datasets = ">=2.18.0"

[tool.poetry.extras]
flash = ["flash-attn"]

[tool.poetry.dependencies.flash-attn]
version = ">=2.8.3"
optional = true


[tool.poetry.group.lint.dependencies]
black = ">=23.1,<27.0"
ruff = ">=0.5.1,<0.15.9"


[tool.poetry.group.test.dependencies]
pytest = ">=8.1.1,<10.0.0"

[tool.poetry.group.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Keep Stage 4.5 entrypoint intentionally compact (<=60 lines) per project
# hard gate; allow one-line constructs there without relaxing global style.
per-file-ignores = { "training/run_3b.py" = ["E401", "E701", "E702"] }

[tool.mypy]
python_version = "3.10"
# Scope: lint the library surface + training modules. Tests intentionally
# excluded — they monkey-patch internals and exercise API edges where strict
# typing would require extensive Any / cast noise without improving signal.
files = ["open_mythos", "training"]
exclude = [
    # Experimental variant: its public contract is informal and it uses its
    # own RotaryEmbedding paradigm that doesn't type-check cleanly alongside
    # the complex-number primitives module. Revisit if moda graduates.
    "open_mythos/experimental/",
]
# loguru / datasets / transformers / torch sub-modules ship incomplete stubs;
# swallowing import errors lets us type-check the first-party code without
# needing a full typeshed build per dep.
ignore_missing_imports = true
# Gentle baseline: no strict Optional, no untyped-def enforcement yet.
# Tighten progressively while keeping mypy as the primary type gate.
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false

[tool.black]
target-version = ["py310"]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
)/
'''
